<script>
/* Avant la première peinture : thème mémorisé + préchargeur (1re visite de session) */
(function () {
  var d = document.documentElement;
  d.classList.add('js');
  /* sombre par défaut ; « ml-theme-v2 » : les choix faits quand le clair était le défaut sont ignorés */
  try { var th = localStorage.getItem('ml-theme-v2'); if (th === 'light' || th === 'dark') d.setAttribute('data-theme', th); } catch (e) {}
  try {
    if (!sessionStorage.getItem('ml-seen') && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      d.classList.add('preload');
    }
  } catch (e) {}
  setTimeout(function () { d.classList.add('preload-timeout'); }, 4200);
})();
</script>
</head>
<body>
<!-- Liquid glass : filtre de réfraction (displacement map) appliqué au backdrop -->
<svg aria-hidden="true" width="0" height="0" style="position:absolute;width:0;height:0;overflow:hidden">
  <defs>
    <filter id="glassDistort" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.009 0.011" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="1.3" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="28" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glassDistortSm" x="-25%" y="-25%" width="150%" height="150%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.024" numOctaves="2" seed="4" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="1" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="9" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
</svg>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
