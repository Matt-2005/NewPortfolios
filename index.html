<script>
/* Avant la première peinture : thème mémorisé + préchargeur (1re visite de session) */
(function () {
  var d = document.documentElement;
  d.classList.add('js');
  try { var th = localStorage.getItem('ml-theme'); if (th) d.setAttribute('data-theme', th); } catch (e) {}
  try {
    if (!sessionStorage.getItem('ml-seen') && !window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
      d.classList.add('preload');
    }
  } catch (e) {}
  setTimeout(function () { d.classList.add('preload-timeout'); }, 4200);
})();
</script>
